{%extends "layout.html" %}

{% block content %}

{% if user %}
<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <div class="icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1>{% if is_own_profile %}{{ language['Change-password'] }}{% else %}{{ language['Reset-password-of'] }} {{ user.email }}{% endif %}</h1>
    </div>

    <form method="POST">
      {% if is_own_profile %}
      <div class="form-group">
        <label for="current_password" class="form-label">{{ language['Current-password'] }}</label>
        <input type="password" id="current_password" class="form-control" name="current_password" autocomplete="current-password" required>
      </div>
      {% endif %}

      <div class="form-group">
        <label for="password" class="form-label">{{ language['New-password'] }}</label>
        <input type="password" id="password" class="form-control" name="password" value="" autocomplete="new-password" aria-describedby="password-help" required>
        <small id="password-help">{{ language['Password-help'] }}</small>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">{{ language['Confirm-password'] }}</label>
        <input type="password" id="confirm_password" class="form-control" name="confirm_password" value="" autocomplete="new-password" required>
      </div>

      <button class="btn btn-warning btn-block" type="submit">{{ language['Save'] if is_own_profile else language['Reset'] }}</button>
    </form>
  </div>
</div>
{% endif %}

{% endblock %}
