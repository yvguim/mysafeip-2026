<!DOCTYPE html>
<html lang="{{ language['html_lang']|default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ language['Setup-title'] }} · MySafeIP</title>
  <link href="/static/modern.css" rel="stylesheet">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <h1>{{ language['Setup-title'] }}</h1>
      <p>{{ language['Setup-intro'] }}</p>
      {% if error %}<p class="alert alert-danger" role="alert">{{ language[error] }}</p>{% endif %}
      <form method="post" action="/setup">
        <div class="form-group">
          <label class="form-label" for="email">{{ language['Email-address'] }}</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">{{ language['Password'] }}</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required>
          <small id="password-help">{{ language['Setup-password-help'] }}</small>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">{{ language['Setup-confirm-password'] }}</label>
          <input class="form-control" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">{{ language['Setup-submit'] }}</button>
      </form>
    </div>
  </main>
</body>
</html>
